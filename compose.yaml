services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: doubtfire
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - doubtfire-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doubtfire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  doubtfire-postgres-data:
